name: ClaudeUsage
options:
  bundleIdPrefix: com.marcochiozzi
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ClaudeUsage
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Claude Usage
        AppGroup: $(DEVELOPMENT_TEAM).claudeusage
    entitlements:
      path: App/ClaudeUsage.entitlements
      properties:
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).claudeusage]
    dependencies:
      - target: ClaudeUsageWidget
  ClaudeUsageWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ClaudeUsage.Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        AppGroup: $(DEVELOPMENT_TEAM).claudeusage
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClaudeUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).claudeusage]
